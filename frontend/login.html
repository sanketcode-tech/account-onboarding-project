<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Northbridge Bank — Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="Northbridge Bank home">
            <span class="brand-mark">N</span>
            <span>Northbridge Bank</span>
        </a>

        <nav class="header-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a id="nav-status" href="status.html">Status</a>
            <a id="nav-login" href="login.html" class="btn btn-link">Log In</a>
            <a id="nav-register" href="register.html" class="btn btn-primary">Register</a>
            <button id="nav-logout" type="button" class="btn btn-ghost hidden">Log Out</button>
        </nav>
    </div>
</header>

<div class="container" style="max-width:420px; margin-top:3rem;">
    <h1>Customer Login</h1>

    <div id="success-banner" class="alert alert-success hidden" role="status"></div>
    <div id="error-banner" class="alert alert-error hidden" role="alert"></div>

    <form id="login-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="6" />
        </div>

        <div class="flex" style="justify-content:space-between; align-items:center;">
            <button id="submit-btn" class="btn" type="submit">Login</button>
            <div id="spinner" class="spinner hidden" aria-hidden="true"></div>
        </div>
    </form>

    <p style="margin-top:1rem; font-size:0.95rem; color:#666;">Don't have an account? <a href="register.html">Register</a></p>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    (function(){
        const auth = window.auth;
        const isLoggedIn = auth && typeof auth.isLoggedIn === 'function' ? auth.isLoggedIn() : false;
        const successBanner = document.getElementById('success-banner');
        const params = new URLSearchParams(window.location.search);

        if (params.get('registered') === '1') {
            successBanner.textContent = 'Registration successful. Please log in to continue.';
            successBanner.classList.remove('hidden');
        }

        if (isLoggedIn) {
            document.getElementById('nav-login').textContent = 'Dashboard';
            document.getElementById('nav-login').href = 'status.html';
            document.getElementById('nav-register').textContent = 'View Status';
            document.getElementById('nav-register').href = 'status.html';
            document.getElementById('nav-logout').classList.remove('hidden');
        }

        const logoutBtn = document.getElementById('nav-logout');
        if (logoutBtn) logoutBtn.addEventListener('click', function () {
            if (auth && typeof auth.logout === 'function') {
                auth.logout(false);
            }
            window.location.href = 'index.html';
        });

        const form = document.getElementById('login-form');
        const errorBanner = document.getElementById('error-banner');
        const spinner = document.getElementById('spinner');
        const submitBtn = document.getElementById('submit-btn');

        function showError(msg){ errorBanner.textContent = msg; errorBanner.classList.remove('hidden'); }
        function clearError(){ errorBanner.textContent = ''; errorBanner.classList.add('hidden'); }
        function setLoading(loading){ if(loading){ spinner.classList.remove('hidden'); submitBtn.disabled = true; } else { spinner.classList.add('hidden'); submitBtn.disabled = false; } }

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); clearError(); setLoading(true);
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            try {
                const res = await window.apiClient.post(window.apiClient.defaults.auth + '/login', { email, password });
                if (res.ok) {
                    const data = await res.json();
                    const token = data.token || data.jwtToken;
                    if (!token) throw new Error('No token returned from auth service');
                    window.auth.setToken(token);
                    sessionStorage.removeItem('currentApplicationId');
                    // redirect to current account landing page after login
                    window.location.href = 'status.html';
                } else {
                    let msg = 'Login failed';
                    try { const body = await res.json(); msg = body.message || JSON.stringify(body); } catch(e){}
                    showError(msg);
                }
            } catch (err) {
                console.error(err);
                showError(err.message || 'Login error');
            } finally { setLoading(false); }
        });
    })();
</script>
</body>
</html>
