<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northbridge Bank - Onboarding</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">Northbridge Bank</div>
        <div class="navbar-menu">
            <a href="#" id="nav-home">Home</a>
            <a href="#" id="nav-apply">Apply</a>
            <a href="#" id="nav-status">Status</a>
            <button id="nav-logout" class="btn-logout" style="display: none;">Logout</button>
            <a href="#" id="nav-login" onclick="showLoginPage()">Login</a>
        </div>
    </div>

    <div id="app-container">
        <!-- Pages will be injected here -->
    </div>

    <!-- Page Templates -->
    <template id="login-page">
        <div class="container">
            <h1>Customer Login</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
    </template>

    <template id="apply-page">
        <div class="container">
            <h1>Apply for Current Account</h1>
            <form id="application-form">
                <fieldset>
                    <legend>Personal Details</legend>
                    <div class="form-group">
                        <label for="fullName">Full Name:</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>
                    <div class="form-group">
                        <label for="dob">Date of Birth:</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                    <div class="form-group">
                        <label for="panNumber">PAN Number:</label>
                        <input type="text" id="panNumber" name="panNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address:</label>
                        <textarea id="address" name="address" required></textarea>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Employment Details</legend>
                    <div class="form-group">
                        <label for="occupation">Occupation:</label>
                        <input type="text" id="occupation" name="occupation" required>
                    </div>
                    <div class="form-group">
                        <label for="annualIncome">Annual Income:</label>
                        <input type="number" id="annualIncome" name="annualIncome" required>
                    </div>
                    <div class="form-group">
                        <label for="employerName">Employer Name:</label>
                        <input type="text" id="employerName" name="employerName" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Account Preferences</legend>
                    <div class="form-group">
                        <label for="branch">Preferred Branch:</label>
                        <input type="text" id="branch" name="branch" required>
                    </div>
                    <div class="form-group">
                        <label for="initialDeposit">Initial Deposit:</label>
                        <input type="number" id="initialDeposit" name="initialDeposit" required>
                    </div>
                    <div class="form-group">
                        <label for="debitCard">
                            <input type="checkbox" id="debitCard" name="debitCard">
                            Require Debit Card
                        </label>
                    </div>
                </fieldset>

                <button type="submit" class="btn">Submit Application</button>
            </form>
        </div>
    </template>

    <template id="status-page">
        <div class="container">
            <h1>Application Status</h1>
            <div id="status-content">
                <p>Loading status...</p>
            </div>
        </div>
    </template>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
