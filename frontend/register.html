<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Northbridge Bank — Register</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="Northbridge Bank home">
            <span class="brand-mark">N</span>
            <span>Northbridge Bank</span>
        </a>

        <nav class="header-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a id="nav-status" href="status.html">Status</a>
            <a id="nav-login" href="login.html" class="btn btn-link">Log In</a>
            <a id="nav-register" href="register.html" class="btn btn-primary">Register</a>
            <button id="nav-logout" type="button" class="btn btn-ghost hidden">Log Out</button>
        </nav>
    </div>
</header>

<div class="container" style="max-width:540px; margin-top:2.5rem;">
    <h1>Create an account</h1>

    <div id="error-banner" class="alert alert-error hidden" role="alert"></div>
    <div id="success-banner" class="alert alert-success hidden" role="status"></div>

    <form id="register-form">
        <div class="form-group">
            <label for="firstName">First name</label>
            <input id="firstName" name="firstName" type="text" required />
        </div>
        <div class="form-group">
            <label for="lastName">Last name</label>
            <input id="lastName" name="lastName" type="text" required />
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="6" />
        </div>

        <div class="flex" style="justify-content:space-between; align-items:center;">
            <button id="submit-btn" class="btn" type="submit">Register</button>
            <div id="spinner" class="spinner hidden" aria-hidden="true"></div>
        </div>
    </form>

    <p style="margin-top:1rem; font-size:0.95rem; color:#666;">Already have an account? <a href="login.html">Login</a></p>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    (function(){
        const auth = window.auth;
        const isLoggedIn = auth && typeof auth.isLoggedIn === 'function' ? auth.isLoggedIn() : false;

        if (isLoggedIn) {
            document.getElementById('nav-login').textContent = 'Dashboard';
            document.getElementById('nav-login').href = 'status.html';
            document.getElementById('nav-register').textContent = 'View Status';
            document.getElementById('nav-register').href = 'status.html';
            document.getElementById('nav-logout').classList.remove('hidden');
        }

        const logoutBtn = document.getElementById('nav-logout');
        logoutBtn.addEventListener('click', function () {
            if (auth && typeof auth.logout === 'function') {
                auth.logout(false);
            }
            window.location.href = 'index.html';
        });

        const form = document.getElementById('register-form');
        const errorBanner = document.getElementById('error-banner');
        const successBanner = document.getElementById('success-banner');
        const spinner = document.getElementById('spinner');
        const submitBtn = document.getElementById('submit-btn');

        function showError(msg){ errorBanner.textContent = msg; errorBanner.classList.remove('hidden'); }
        function clearError(){ errorBanner.textContent = ''; errorBanner.classList.add('hidden'); }
        function showSuccess(msg){ successBanner.textContent = msg; successBanner.classList.remove('hidden'); }
        function clearSuccess(){ successBanner.textContent = ''; successBanner.classList.add('hidden'); }
        function setLoading(loading){ if(loading){ spinner.classList.remove('hidden'); submitBtn.disabled = true; } else { spinner.classList.add('hidden'); submitBtn.disabled = false; } }

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); clearError(); clearSuccess(); setLoading(true);
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await window.apiClient.post(window.apiClient.defaults.auth + '/register', { firstName, lastName, email, password });
                if (res.status === 201 || res.ok) {
                    showSuccess('Registration successful. Please log in to continue.');
                    setTimeout(() => {
                        window.location.href = 'login.html?registered=1';
                    }, 1200);
                } else {
                    let msg = 'Registration failed';
                    try { const body = await res.json(); msg = body.message || JSON.stringify(body); } catch(e){}
                    showError(msg);
                }
            } catch (err) {
                console.error(err);
                showError(err.message || 'Unexpected error');
            } finally { setLoading(false); }
        });
    })();
</script>
</body>
</html>
