<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Northbridge Bank — Application Status</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="Northbridge Bank home">
            <span class="brand-mark">N</span>
            <span>Northbridge Bank</span>
        </a>

        <nav class="header-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="apply.html">Apply</a>
            <a id="nav-login" href="login.html" class="btn btn-link">Log In</a>
            <a id="nav-register" href="register.html" class="btn btn-primary">Register</a>
            <button id="nav-logout" type="button" class="btn btn-ghost hidden">Log Out</button>
        </nav>
    </div>
</header>

<div class="container" id="main-container" style="margin-top:2rem; margin-bottom:2rem;">
    <div id="status-banner" class="alert alert-info hidden"></div>
    <div id="status-area">
        <div id="product-intro" class="product-intro">
            <div class="product-header-row">
                <h2 class="product-title">Current Account</h2>
                <button id="start-application" class="btn btn-primary product-start-btn" type="button">Start Application</button>
            </div>

            <div class="process-section">
                <h3>The process</h3>
                <div class="process-grid">
                    <div class="process-item">
                        <span class="step-number">1</span>
                        <div class="step-copy">
                            <h4>Product setup</h4>
                            <p>Set up your business current account.</p>
                        </div>
                    </div>
                    <div class="process-item">
                        <span class="step-number">2</span>
                        <div class="step-copy">
                            <h4>Documents</h4>
                            <p>Submit any required documents.</p>
                        </div>
                    </div>
                    <div class="process-item">
                        <span class="step-number">3</span>
                        <div class="step-copy">
                            <h4>Offer</h4>
                            <p>Get an offer and review terms and conditions.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .product-intro {
        width: 100%;
        padding-top: 1rem;
    }
    .product-header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        border-bottom: 1px solid rgba(26,58,82,0.18);
        padding-bottom: 1.25rem;
        margin-bottom: 1.25rem;
    }
    .product-title {
        font-size: clamp(2.6rem, 4vw, 5.2rem);
        line-height: 1.02;
        letter-spacing: -0.06em;
        font-weight: 300;
        color: #1a3a52;
        flex: 1;
        margin: 0;
    }
    .product-start-btn {
        min-width: 270px;
        min-height: 62px;
        font-size: 1.1rem;
        padding: 1rem 1.75rem;
        border-radius: 10px;
        background: #1a3a52;
        color: white;
        box-shadow: none;
    }
    .product-start-btn:hover {
        background: #244b67;
    }
    .process-section {
        padding-top: 0.5rem;
    }
    .process-section h3 {
        font-size: clamp(2rem, 2vw, 2.8rem);
        margin-bottom: 1.5rem;
        color: #1a3a52;
        font-weight: 400;
    }
    .process-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(26,58,82,0.18);
    }
    .process-item {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        padding-right: 1rem;
    }
    .step-number {
        font-size: 1.15rem;
        line-height: 1;
        font-weight: 700;
        color: #2f9d7d; /* project green */
        min-width: auto;
        padding: 0;
        margin-right: 0.75rem;
        display: inline-block;
    }
    .step-copy h4 {
        font-size: clamp(1.6rem, 2vw, 2.5rem);
        color: #1a3a52;
        font-weight: 300;
        line-height: 1.2;
        margin-bottom: 0.4rem;
    }
    .step-copy p {
        font-size: 1.1rem;
        color: #1a3a52;
        max-width: 17ch;
        line-height: 1.4;
    }
    @media (max-width: 900px) {
        .product-header-row {
            flex-wrap: wrap;
        }
        .product-controls {
            order: 2;
            margin-left: 0;
            margin-right: 0;
        }
        .product-start-btn {
            width: 100%;
            min-width: auto;
        }
        .process-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    (async function(){
        // Require login
        if (!window.auth || !window.auth.getToken()) { window.location.href = 'login.html'; return; }
        document.getElementById('nav-login').textContent = 'Dashboard';
        document.getElementById('nav-login').href = 'status.html';
        document.getElementById('nav-register').textContent = 'View Status';
        document.getElementById('nav-register').href = 'status.html';
        document.getElementById('nav-logout').classList.remove('hidden');
        const __navLogout = document.getElementById('nav-logout'); if (__navLogout) __navLogout.addEventListener('click', function () {
            window.auth.logout(false);
            window.location.href = 'index.html';
        });

        const startApplicationBtn = document.getElementById('start-application');
        if (startApplicationBtn) {
            // hide start button until backend confirms there is no application for this customer
            startApplicationBtn.classList.add('hidden');
            startApplicationBtn.addEventListener('click', function () {
                window.location.href = 'apply.html';
            });
        }

        const statusArea = document.getElementById('status-area');
        const statusBanner = document.getElementById('status-banner');

        let applicationId = null;
        // Ask backend for most recent application for this authenticated customer
        try {
            const res = await window.apiClient.get(window.apiClient.defaults.application + '/my-application');
            if (res.status === 200) {
                const j = await res.json();
                applicationId = j.applicationId;
                if (applicationId) sessionStorage.setItem('currentApplicationId', applicationId);
            } else if (res.status === 404) {
                // Backend explicitly confirms no application exists for this customer
                if (startApplicationBtn) startApplicationBtn.classList.remove('hidden');
                return; // show default start view
            }
        } catch (err) {
            // network/auth error — fall back to client-stored state below
        }

        // If backend didn't provide an applicationId, fall back to URL/session storage
        if (!applicationId) {
            const params = new URLSearchParams(window.location.search);
            const paramAppId = params.get('applicationId');
            const sessAppId = sessionStorage.getItem('currentApplicationId');
            applicationId = paramAppId || sessAppId;
        }

        if (!applicationId) {
            // reveal start button if no app known client-side
            if (startApplicationBtn) startApplicationBtn.classList.remove('hidden');
            return;
        }

        let pollHandle = null;
        const POLL_INTERVAL = 4000;
        // Snapshot of last rendered state (stringified) to avoid unnecessary DOM updates
        let lastState = null;
        // Tracks the last status-stage signal so we only fetch a detail endpoint when the stage changes
        let lastStatusSignal = null;
        // Prevent overlapping polls
        let pollingInFlight = false;

        function stopPolling() {
            if (pollHandle) {
                clearInterval(pollHandle);
                pollHandle = null;
            }
        }

        function showBanner(msg){ statusBanner.textContent = msg; statusBanner.classList.remove('hidden'); }
        function hideBanner(){ statusBanner.textContent = ''; statusBanner.classList.add('hidden'); }

        function formatLimit(value) {
            if (value === null || value === undefined) return 'N/A';
            const n = Number(value);
            if (Number.isNaN(n)) return 'N/A';
            return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function renderOffer(offer) {
            const badgeClass = offer.status === 'PENDING' ? 'badge-pending' : (offer.status === 'ACCEPTED' ? 'badge-approved' : 'badge-rejected');
            const statusHtml = `<span class="status-badge ${badgeClass}">${offer.status}</span>`;
            const offeredLimit = formatLimit(offer.offeredLimit);
            const continueSigningBtn = offer.status === 'ACCEPTED'
                ? '<button id="continue-signing" class="btn btn-primary">Continue to Signing</button>'
                : '';
            return `
                <div style="margin-bottom:1rem;">
                    <h3>Overview</h3>
                    <p>The following will give you all the necessary documentation and information about the offer. This includes the pricing information and terms and condition.</p>
                    <p><strong>If you have any queries about the offer, please contact your bank manager.</strong></p>
                    <hr style="margin:0.75rem 0;" />

                    <div class="flex" style="justify-content:space-between; align-items:center;">
                        <div>
                            <p><strong>Application ID:</strong> ${offer.applicationId}</p>
                            <p><strong>Offer ID:</strong> ${offer.offerId}</p>
                            <p><strong>Offered Limit:</strong> ${offeredLimit}</p>
                        </div>
                        <div style="text-align:right;">
                            ${statusHtml}
                            <div style="margin-top:0.5rem; display:flex; gap:0.5rem; flex-wrap:wrap; justify-content:flex-end;">
                                ${offer.status === 'PENDING' ? '<button id="accept-offer" class="btn">Accept Offer</button>' : ''}
                                ${continueSigningBtn}
                                <button id="view-offer" class="btn btn-secondary">View Offer</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderWaitingForOffer() {
            return `
                <div class="container">
                    <p>Your application (<strong>${applicationId}</strong>) is under review. We will notify you when an offer is ready.</p>
                    <div class="flex"><div class="spinner"></div><div>Checking for updates</div></div>
                </div>
            `;
        }

        function renderProgress(status) {
            const statuses = ['PENDING','SIGNED','UPLOADED'];
            const idx = Math.max(0, statuses.indexOf((status||'PENDING').toUpperCase()));
            return `
                <div class="flex" style="gap:0.5rem; margin-top:1rem;">
                    ${statuses.map((s,i) => {
                        const cls = i <= idx ? (s === 'PENDING' ? 'badge-pending' : s === 'SIGNED' ? 'badge-signed' : 'badge-uploaded') : 'badge-info';
                        return `<span class="status-badge ${cls}" style="opacity:${i<=idx?1:0.45}">${s}</span>`;
                    }).join('')}
                </div>
            `;
        }

        async function fetchOfferOnce() {
            try {
                const res = await window.apiClient.get(window.apiClient.defaults.offers + '/' + encodeURIComponent(applicationId));
                if (res.status === 200) {
                    const data = await res.json();
                    return { ok:true, data };
                } else if (res.status === 404) {
                    return { ok:false, status:404 };
                } else {
                    const body = await res.text();
                    return { ok:false, status:res.status, body };
                }
            } catch (err) {
                return { ok:false, error: err };
            }
        }

        async function poll() {
            if (pollingInFlight) return;
            pollingInFlight = true;
            hideBanner();

            try {
                const stRes = await window.apiClient.get(window.apiClient.defaults.applications + '/' + encodeURIComponent(applicationId) + '/status');
                if (stRes.status !== 200) {
                    const message = 'Unable to fetch application status';
                    const statusState = JSON.stringify({ type: 'status-error', message });
                    if (statusState !== lastState) {
                        lastState = statusState;
                        statusArea.innerHTML = `<div class="alert alert-error">${message}</div>`;
                    }
                    return;
                }

                const status = await stRes.json();
                const overall = (status.overallStatus || status.stage || status.currentStage || 'IN_PROGRESS').toUpperCase();
                const stageSignal = overall === 'ACTIVE' ? 'ACTIVE' : (overall === 'ACTIVATED' ? 'ACTIVATED' : (overall === 'DECLINED' ? 'DECLINED' : 'IN_PROGRESS'));

                if (stageSignal === 'DECLINED') {
                    const newState = JSON.stringify({ type: 'terminal', overall: 'DECLINED', declineReason: status.declineReason });
                    if (newState !== lastState) {
                        lastState = newState;
                        statusArea.innerHTML = `
                            <div class="container">
                                <h2>Application Declined</h2>
                                <div class="card" style="padding:1rem; margin-top:1rem;">
                                    <p>Your application <strong>${applicationId}</strong> has been declined.</p>
                                    <p><strong>Reason:</strong> ${status.declineReason || 'No reason provided'}</p>
                                </div>
                                <div style="margin-top:1rem;"><a class="btn" href="index.html">Return to home</a></div>
                            </div>
                        `;
                    }
                    stopPolling();
                    return;
                }

                if (stageSignal === 'ACTIVATED' || stageSignal === 'ACTIVE') {
                    const accRes = await window.apiClient.get(window.apiClient.defaults.accounts + '/' + encodeURIComponent(applicationId));
                    const account = accRes.status === 200 ? await accRes.json() : {
                        accountId: status.accountId,
                        offeredLimit: status.offeredLimit,
                        status: 'ACTIVE',
                        activatedAt: status.activatedAt
                    };

                    const newState = JSON.stringify({ type: 'account', accountId: account.accountId, status: account.status, offeredLimit: account.offeredLimit, activatedAt: account.activatedAt });
                    if (newState !== lastState) {
                        lastState = newState;
                        statusArea.innerHTML = `
                            <div class="container">
                                <h2>Account Activated</h2>
                                <div class="card" style="padding:1rem; margin-top:1rem;">
                                    <p><strong>Account ID:</strong> ${account.accountId}</p>
                                    <p><strong>Offered Limit:</strong> ${formatLimit(account.offeredLimit)}</p>
                                    <p><strong>Status:</strong> <span class="status-badge badge-approved">${account.status || 'ACTIVE'}</span></p>
                                    <p><strong>Activated at:</strong> ${account.activatedAt ? new Date(account.activatedAt).toLocaleString() : ''}</p>
                                </div>
                                <div style="margin-top:1rem;"><a class="btn" href="index.html">Return to home</a></div>
                            </div>
                        `;
                    }
                    stopPolling();
                    return;
                }

                if (lastStatusSignal === stageSignal) {
                    return;
                }
                lastStatusSignal = stageSignal;

                const stageDetailStatus = await fetchOfferOnce();
                if (stageDetailStatus.ok) {
                    const offer = stageDetailStatus.data;
                    if ((offer.status || '').toUpperCase() === 'ACCEPTED') {
                        const docRes = await window.apiClient.get(window.apiClient.defaults.documents + '/' + encodeURIComponent(applicationId));
                        let docStatus = 'NONE';
                        if (docRes.status === 200) {
                            const doc = await docRes.json();
                            docStatus = (doc.status || '').toUpperCase();
                        }

                        const newState = JSON.stringify({ type: 'offer', offerId: offer.offerId, offerStatus: (offer.status || '').toUpperCase(), docStatus });
                        if (newState !== lastState) {
                            lastState = newState;
                            if (docStatus === 'PENDING' || docStatus === 'NONE') {
                                statusArea.innerHTML = `
                                    <div class="container">
                                        <h2>Awaiting signature</h2>
                                        <p>Your offer is accepted. Please complete the signing ceremony. <a class="btn btn-primary" href="document.html?applicationId=${encodeURIComponent(applicationId)}">Go to signing</a></p>
                                    </div>
                                `;
                                return;
                            }
                            if (docStatus === 'SIGNED') {
                                statusArea.innerHTML = `
                                    <div class="container">
                                        <h2>Awaiting signing ceremony review</h2>
                                        <p>We've received your signature and are reviewing it. This is a short approval step before provisioning.</p>
                                        ${renderProgress('SIGNED')}
                                    </div>
                                `;
                                return;
                            }
                            if (docStatus === 'UPLOADED') {
                                // Show congratulations-style summary after successful upload/signing
                                statusArea.innerHTML = `
                                    <div class="container">
                                        <h2>Congratulations!</h2>
                                        <p class="muted">Awaiting provisioning approval</p>
                                        <div class="card" style="padding:1rem; margin-top:1rem;">
                                            <p>Thanks for accepting your offer. We'll be in touch if we need any further information or documentation from you or the associated persons. The application is currently awaiting provisioning approval. Once all authorised parties have accepted the offer your account will be activated within the business day.</p>
                                            <p class="muted"><strong>Application reference:</strong> ${applicationId}</p>
                                        </div>

                                        <h3 style="margin-top:1.5rem;">What happens next?</h3>
                                        <div style="display:flex; gap:2rem; margin-top:1rem; flex-wrap:wrap;">
                                            <div style="flex:1; min-width:200px;">
                                                <strong>Deposit books have been ordered</strong>
                                                <p class="muted">You need to collect your deposit and cheque books from the branch.</p>
                                            </div>
                                            <div style="flex:1; min-width:200px;">
                                                <strong>Proof of account letter will be emailed</strong>
                                                <p class="muted">Once the account(s) is activated, we will send you an email with the details of the account(s).</p>
                                            </div>
                                        </div>

                                        <p style="margin-top:1.5rem;" class="muted">For any questions, please contact your business manager.</p>
                                        <div style="margin-top:1rem;"><a class="btn" href="status.html?applicationId=${encodeURIComponent(applicationId)}">Done</a></div>
                                    </div>
                                `;
                                return;
                            }
                            statusArea.innerHTML = renderOffer(offer);
                            document.getElementById('view-offer')?.addEventListener('click', () => showPrintableOffer(offer));
                            document.getElementById('continue-signing')?.addEventListener('click', () => {
                                window.location.href = 'document.html?applicationId=' + encodeURIComponent(applicationId);
                            });
                        }
                        return;
                    }

                    const offerState = JSON.stringify({ type: 'offer', offerId: offer.offerId, offerStatus: (offer.status || '').toUpperCase(), offeredLimit: offer.offeredLimit });
                    if (offerState !== lastState) {
                        lastState = offerState;
                        statusArea.innerHTML = renderOffer(offer);
                        document.getElementById('view-offer')?.addEventListener('click', () => showPrintableOffer(offer));
                        document.getElementById('continue-signing')?.addEventListener('click', () => {
                            window.location.href = 'document.html?applicationId=' + encodeURIComponent(applicationId);
                        });
                    }

                    const acceptBtn = document.getElementById('accept-offer');
                    if (acceptBtn) {
                        acceptBtn.addEventListener('click', async () => {
                            acceptBtn.disabled = true; acceptBtn.textContent = 'Accepting...';
                            try {
                                const acceptRes = await window.apiClient.post(window.apiClient.defaults.offers + '/' + encodeURIComponent(applicationId) + '/accept', {});
                                if (acceptRes.ok) {
                                    const accepted = await acceptRes.json();
                                    showBanner('Offer accepted successfully.');
                                    lastState = null;
                                    lastStatusSignal = null;
                                    statusArea.innerHTML = renderOffer(accepted);
                                    document.getElementById('view-offer')?.addEventListener('click', () => showPrintableOffer(accepted));
                                    document.getElementById('continue-signing')?.addEventListener('click', () => {
                                        window.location.href = 'document.html?applicationId=' + encodeURIComponent(applicationId);
                                    });
                                } else {
                                    let msg = 'Failed to accept offer';
                                    try { const b = await acceptRes.json(); msg = b.error || b.message || JSON.stringify(b); } catch (e) {}
                                    showBanner(msg);
                                    acceptBtn.disabled = false; acceptBtn.textContent = 'Accept Offer';
                                }
                            } catch (err) {
                                console.error(err);
                                showBanner('Network error while accepting offer');
                                acceptBtn.disabled = false; acceptBtn.textContent = 'Accept Offer';
                            }
                        });
                    }
                    return;
                }

                if (stageDetailStatus.status === 404) {
                    const waitingState = JSON.stringify({ type: 'waiting' });
                    if (waitingState !== lastState) {
                        lastState = waitingState;
                        statusArea.innerHTML = renderWaitingForOffer();
                    }
                    return;
                }

                const message = stageDetailStatus.body || (stageDetailStatus.error && stageDetailStatus.error.message) || 'Unexpected error';
                const errState = JSON.stringify({ type: 'error', message });
                if (errState !== lastState) {
                    lastState = errState;
                    statusArea.innerHTML = `<div class="alert alert-error">${message}</div>`;
                }
            } finally {
                pollingInFlight = false;
            }
        }

        function showPrintableOffer(offer) {
            const w = window.open('', '_blank');
            const html = `
                <html>
                <head>
                    <title>Offer ${offer.offerId}</title>
                    <style>
                        body { font-family: -apple-system,BlinkMacSystemFont, 'Segoe UI', Roboto, Arial; padding:2rem; color:#1a3a52 }
                        .card { border:1px solid #ddd; padding:1rem; border-radius:8px; max-width:720px }
                        h1 { color:#1a3a52 }
                        .muted { color:#666 }
                    </style>
                </head>
                <body>
                    <div class="card">
                        <h1>Northbridge Bank — Offer</h1>
                        <p><strong>Application ID:</strong> ${offer.applicationId}</p>
                        <p><strong>Offer ID:</strong> ${offer.offerId}</p>
                        <p><strong>Offered Limit:</strong> ${formatLimit(offer.offeredLimit)}</p>
                        <p><strong>Status:</strong> ${offer.status}</p>
                        <p class="muted">Generated: ${offer.createdAt ? new Date(offer.createdAt).toLocaleString() : ''}</p>
                        <hr />
                        <p>This is the offer produced for your application. Please accept the offer in the online portal to proceed with signing.</p>
                        <div style="margin-top:1.5rem;"><button onclick="window.print();">Print</button></div>
                    </div>
                </body>
                </html>
            `;
            w.document.write(html);
            w.document.close();
        }

        // Start polling
        poll();
        pollHandle = setInterval(poll, POLL_INTERVAL);

        // Clean up on unload
        window.addEventListener('beforeunload', () => { if (pollHandle) clearInterval(pollHandle); });

    })();
</script>
</body>
</html>
