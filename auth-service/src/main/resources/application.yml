spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: root
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

server:
  port: ${SERVER_PORT_AUTH:8081}
  servlet:
    context-path: /

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:changeme-this-is-default-secret-key-not-for-production}
    expiration: ${AUTH_JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:63342}

# CORS allowed origins for frontend (comma separated)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:63342}

logging:
  level:
    root: INFO
    com.northbridge: INFO

